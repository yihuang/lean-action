name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: lake build
        uses: leanprover/lean-action@v1
        with:
          # Explicit rather than auto-detected, so that the intent is visible:
          # the package has no lint driver (no Mathlib); building the default
          # targets — the library, the examples, and the `LeanActionTests`
          # regression suite — is the whole check (the tests are proofs, so
          # compiling them *is* running them).
          auto-config: false
          build: true
          test: false
          lint: false
